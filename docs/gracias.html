<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estado de tu pago</title>
  <link rel="stylesheet" href="carrito.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cc-fondo); color: var(--cc-texto); }
    main { max-width: 560px; margin: 0 auto; padding: 4rem 1.25rem; line-height: 1.55; }
    h1 { font-size: 1.8rem; margin: 0 0 1rem; }
    p { color: var(--cc-texto-suave); }
    a.cc-btn { display: inline-block; text-decoration: none; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Consultando tu pago…</h1>
    <p id="detalle">Esto tarda unos segundos.</p>
    <a class="cc-btn" href="tienda.html">Volver a la tienda</a>
  </main>

  <script src="tienda-config.js"></script>
  <script src="carrito.js"></script>
  <script>
    (async function () {
      const titulo = document.getElementById('titulo');
      const detalle = document.getElementById('detalle');
      const id = new URLSearchParams(location.search).get('id'); // Wompi agrega ?id=ID_TRANSACCION
      const cfg = window.TIENDA_CONFIG || {};

      function mostrar(t, d) { titulo.textContent = t; detalle.textContent = d; }

      if (!id || !cfg.workerUrl) {
        mostrar('Gracias por tu compra', 'Te enviaremos la confirmación de tu pedido por correo electrónico.');
        return;
      }
      try {
        const r = await fetch(cfg.workerUrl.replace(/\/$/, '') + '/estado?id=' + encodeURIComponent(id));
        const t = await r.json();
        if (t.status === 'APPROVED') {
          window.Carrito && window.Carrito.vaciar();
          mostrar('Pago aprobado', `Tu número de pedido es ${t.reference}. Te enviaremos la confirmación por correo.`);
        } else if (t.status === 'PENDING') {
          window.Carrito && window.Carrito.vaciar();
          mostrar('Pago en proceso', `Pedido ${t.reference}. Tu banco aún no confirma el pago; te avisaremos por correo cuando se apruebe.`);
        } else {
          mostrar('El pago no se completó', 'Tu carrito sigue guardado. Puedes intentarlo de nuevo o usar otro medio de pago.');
        }
      } catch (e) {
        mostrar('Gracias por tu compra', 'No pudimos consultar el estado ahora mismo. Te enviaremos la confirmación por correo.');
      }
    })();
  </script>
</body>
</html>
