<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda de Aceites Esenciales y Productos Naturales | BOAchem</title>

<link rel="canonical" href="https://boachem.com/tienda.html">
<link rel="icon" href="/favicon.ico">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<meta property="og:site_name" content="BOAchem">
<meta property="og:title" content="Tienda de Aceites Esenciales y Productos Naturales | BOAchem">
<meta property="og:description" content="Compra en línea aceites esenciales, alcohol etílico USP y glicerina USP. Pago seguro y envíos en Colombia.">
<meta property="og:url" content="https://boachem.com/tienda.html">
<meta property="og:image" content="https://boachem.com/LOGO.jpg">
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="carrito.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos mínimos solo para esta página de ejemplo; en tu sitio usa los tuyos. */
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cc-fondo); color: var(--cc-texto); }
    html { scroll-behavior: smooth; }
    main { max-width: 1080px; margin: 0 auto; padding: 3rem 1.25rem 6rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 0.5rem; }
    .intro { color: var(--cc-texto-suave); max-width: 60ch; margin: 0 0 2.5rem; line-height: 1.55; }
    /* Botón flotante de WhatsApp, encima del botón del carrito */
    .fab-wa { position: fixed; right: 1.25rem; bottom: calc(1.25rem + 58px + 12px + env(safe-area-inset-bottom, 0px));
      z-index: 900; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
      background: #25D366; color: #fff; box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35); transition: transform 0.15s; }
    .fab-wa:hover { transform: translateY(-2px) scale(1.04); }
    .fab-wa svg { width: 30px; height: 30px; }
  </style>
</head>
<body>

<div id="nav-menu"></div>

  <main>
    <h1>Nuestros productos</h1>
    <p class="intro">Envío a todo Colombia.</p>

    <!-- El carrito llena este contenedor con los productos de productos.json,
         agrupados en secciones según el campo "category" de cada producto. -->
    <div id="tienda-productos"></div>

    <!--
      Si prefieres armar tus propias tarjetas de producto, no uses el contenedor
      de arriba: basta con poner en cualquier botón el atributo data-agregar:
      <button data-agregar="lavanda-10ml">Agregar al carrito</button>
    -->
  </main>

  <a class="fab-wa" href="https://wa.me/573204126204?text=%5BWeb%5D%20Hola%20BOAchem%2C%20tengo%20una%20pregunta%20sobre%20la%20tienda." target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg></a>

  <div id="end-info"></div>

  <script src="tienda-config.js"></script>
  <script src="carrito.js"></script>
  <script>
  fetch('/menu.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('nav-menu').innerHTML = data;
    })
    .catch(error => console.error('Error loading the menu:', error));
</script>
<script>
  fetch('/end-info.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('end-info').innerHTML = data;
    })
    .catch(error => console.error('Error loading the menu:', error));
</script>
</body>
</html>
